  document.body.dataset.timerRunning=String(running);
  document.body.dataset.catMood=pomodoro&&phase!=='focus'?'break':'focus';
  const total=Math.max(0,Math.floor(state.seconds));
  if(total!==shownSecond){
    const hours=Math.floor(total/3600),minutes=Math.floor(total/60)%60,seconds=total%60;
    layoutHours(total);
    h.update({value:hours});m.update({value:minutes});s.update({value:seconds});
    shownSecond=total;
  }
  document.querySelector('.time').setAttribute('aria-label',`${mode!=='stopwatch'?'Time remaining':'Elapsed time'}: ${Math.floor(total/3600)} hours ${Math.floor(total/60)%60} minutes ${total%60} seconds`);
  let action=running?'Pause':elapsed>0?'Resume':'Start';
  if(pomodoro){
    if(completed)action=phase==='focus'?'Start break':'Start focus';
    else if(!running&&elapsed===0)action=phase==='focus'?'Start focus':'Start break';
  }
  if(countdown&&completed)action='Restart';
  if(countdown&&!state.canStart)action='Set time';
  document.querySelector('#toggle').disabled=state.canStart===false;
  const toggle=document.querySelector('#toggle');
  toggle.setAttribute('aria-label',action);toggle.title=action;
  toggle.dataset.icon=running?'pause':'play';
  timerAdjust.querySelectorAll('button').forEach(button=>{button.disabled=Number(button.dataset.adjust)<0?state.timerDuration===0:state.timerDuration>=86400});
  document.querySelector('#reset').disabled=elapsed===0&&!running;
  document.querySelector('#mode-stopwatch').setAttribute('aria-pressed',String(mode==='stopwatch'));
  document.querySelector('#mode-pomodoro').setAttribute('aria-pressed',String(pomodoro));
  document.querySelector('#mode-timer').setAttribute('aria-pressed',String(countdown));
  const label=document.querySelector('#session-label');label.hidden=!pomodoro&&!(countdown&&completed);
  if(countdown&&completed)setText('#session-label','Timer finished');
  if(pomodoro){
    let message=phase==='focus'?`Focus · ${focusNumber} of 4`:phase==='longBreak'?`Long break · ${state.longBreakMinutes} minutes`:`Break · ${state.breakMinutes} minutes`;
    if(completed)message=phase==='focus'?`Focus complete · ${completedFocusCount%4===0?state.longBreakMinutes:state.breakMinutes}-minute break next`:'Break complete · ready to focus';
    else if(!running&&elapsed>0)message+=' · paused';
    setText('#session-label',message);
  }
  setText('.hint',countdown?'＋ / − for 1 min · Space to start / pause':pomodoro&&!running&&elapsed===0?`${state.focusMinutes} min focus · ${state.breakMinutes} min break · long break after 4`:'Space to start / pause · R to reset');
};
document.querySelector('#mode-stopwatch').onclick=()=>send('mode:stopwatch');
document.querySelector('#mode-pomodoro').onclick=()=>send('mode:pomodoro');
document.querySelector('#mode-timer').onclick=()=>send('mode:timer');
timerAdjust.querySelectorAll('button').forEach(button=>button.onclick=()=>send('adjust:'+button.dataset.adjust));
document.querySelector('#toggle').onclick=()=>send('toggle');document.querySelector('#reset').onclick=()=>send('reset');document.addEventListener('keydown',e=>{
  if(settingsPane.open)return;
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;
  if(e.code==='Space'&&e.target.closest('button'))return;
  if(e.code==='Space'){e.preventDefault();send('toggle')}
  else if(e.key.toLowerCase()==='r'){e.preventDefault();send('reset')}
  else if(document.body.classList.contains('timer-mode')){
    // Accept the unshifted +/= key as well as plus and numeric keypad keys.
    if(e.key==='+'||e.key==='='||e.code==='NumpadAdd'){e.preventDefault();send('adjust:1')}
    else if(e.key==='-'||e.code==='NumpadSubtract'){e.preventDefault();send('adjust:-1')}
  }
});await document.fonts.ready;
const clockElement=document.querySelector('.time');
function fitIdleClock(){
  const width=clockElement.offsetWidth,height=clockElement.offsetHeight;
  if(width&&height)clockElement.style.setProperty('--idle-scale',Math.max(1,Math.min(innerWidth*.96/width,innerHeight*.90/height)));
}
new ResizeObserver(fitIdleClock).observe(clockElement);
let resizeFrame;
const refresh=()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{fitIdleClock()})};
new ResizeObserver(refresh).observe(document.body);
await document.fonts.load('700 80px "DynaPuff"','0123456789:');
const fontCanvas=document.createElement('canvas'),fontContext=fontCanvas.getContext('2d');
fontContext.font='700 100px "DynaPuff"';
digitCell=Math.max(...Array.from('0123456789',digit=>fontContext.measureText(digit).width))/100+.035;
document.documentElement.style.setProperty('--digit-cell',`${digitCell}em`);
layoutHours(shownSecond);
refresh();send('ready');
}
